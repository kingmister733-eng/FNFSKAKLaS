name: Android APK (Psych Engine + uploaded assets)

on:
  workflow_dispatch:
  push:
    branches:
      - android/mobile-port-assets-audit

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PSYCH_UPSTREAM_COMMIT: 5c67ced49e5a98535298a6daa3f8f4ec79ac8399
      BUILD_DIR: ${{ github.workspace }}/.build/PsychEngine
    steps:
      - name: Checkout uploaded project files
        uses: actions/checkout@v4

      - name: Checkout FNF mod assets
        uses: actions/checkout@v4
        with:
          repository: kingmister733-eng/FNF
          ref: 1be5ef46fd816adc05b0e1276b7d83ad23255d11
          path: .mod-source
          sparse-checkout: |
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/shared
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/songs
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/data
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/characters
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/stages
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/weeks
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/images
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/music
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/sounds
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/fonts
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/dustin
      - name: Checkout FNF mod assets
        uses: actions/checkout@v4
        with:
          repository: kingmister733-eng/FNF
          ref: 1be5ef46fd816adc05b0e1276b7d83ad23255d11
          path: .mod-source
          sparse-checkout: |
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/shared
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/songs
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/data
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/characters
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/stages
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/weeks
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/images
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/music
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/sounds
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/fonts
            imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets/dustin
      - name: Set up Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Assemble the exact uploaded source and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$BUILD_DIR")"
          git clone https://github.com/ShadowMario/FNF-PsychEngine.git "$BUILD_DIR"
          git -C "$BUILD_DIR" fetch --depth 1 origin "$PSYCH_UPSTREAM_COMMIT"
          git -C "$BUILD_DIR" checkout --detach "$PSYCH_UPSTREAM_COMMIT"

          cp -a "imported-zip-15A4oADt/Nk/source/." "$BUILD_DIR/source/"
          cp "imported-zip-15A4oADt/Nk/Project.xml" "$BUILD_DIR/Project.xml"

          rm -rf "$BUILD_DIR/assets"
          mkdir -p "$BUILD_DIR/assets"
          cp -a "imported-zip-15A4oADt/Nkk/assets/." "$BUILD_DIR/assets/"

          # Stage the FNF mod as built-in Psych Engine assets.
          MOD_ASSETS="$GITHUB_WORKSPACE/.mod-source/imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets"
          test -d "$MOD_ASSETS/shared"
          copy_mod_assets() {
            local source_dir="$MOD_ASSETS/$1"
            local target_dir="$BUILD_DIR/assets/$2"
            if [[ -d "$source_dir" ]]; then
              mkdir -p "$target_dir"
              cp -a "$source_dir/." "$target_dir/"
            fi
          }
          copy_mod_assets shared shared
          copy_mod_assets songs songs
          copy_mod_assets data shared/data
          copy_mod_assets characters shared/characters
          copy_mod_assets stages shared/stages
          copy_mod_assets weeks shared/weeks
          copy_mod_assets images shared/images
          copy_mod_assets music shared/music
          copy_mod_assets sounds shared/sounds
          copy_mod_assets fonts fonts
          copy_mod_assets dustin dustin

          echo "Staged FNF mod charts and audio:"
          find "$BUILD_DIR/assets/shared/data" -maxdepth 2 -type f -name '*.json' | sort
          find "$BUILD_DIR/assets/songs" -mindepth 2 -maxdepth 2 -type f -name 'Inst.ogg' | sort

          # Bring in the actual FNF mod as built-in Psych Engine assets.
          MOD_ASSETS="$GITHUB_WORKSPACE/.mod-source/imported-zip-15A4oADt/fnd_demo_bug_patch_v1point5/assets"
          test -d "$MOD_ASSETS/shared"
          copy_mod_assets() {
            local source_dir="$MOD_ASSETS/$1"
            local target_dir="$BUILD_DIR/assets/$2"
            if [[ -d "$source_dir" ]]; then
              mkdir -p "$target_dir"
              cp -a "$source_dir/." "$target_dir/"
            fi
          }
          copy_mod_assets shared shared
          copy_mod_assets songs songs
          copy_mod_assets data shared/data
          copy_mod_assets characters shared/characters
          copy_mod_assets stages shared/stages
          copy_mod_assets weeks shared/weeks
          copy_mod_assets images shared/images
          copy_mod_assets music shared/music
          copy_mod_assets sounds shared/sounds
          copy_mod_assets fonts fonts
          copy_mod_assets dustin dustin

          # Android build has video playback disabled; do not package unused cutscene videos.
          rm -rf "$BUILD_DIR/assets/videos"
          echo "Staged FNF mod assets:"
          find "$BUILD_DIR/assets/shared/data" -maxdepth 2 -type f \( -name '*.json' -o -name 'weekList.txt' \) | sort
          find "$BUILD_DIR/assets/songs" -mindepth 2 -maxdepth 2 -type f \( -name 'Inst.ogg' -o -name 'Voices.ogg' \) | sort

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["BUILD_DIR"]) / "Project.xml"
          s = p.read_text()
          old_discord = '<define name="DISCORD_ALLOWED" />'
          if old_discord not in s:
              raise SystemExit("Expected DISCORD_ALLOWED definition was not found")
          s = s.replace(old_discord, '<define name="DISCORD_ALLOWED" if="desktop" />', 1)
          old_video = 'if="windows || linux || android || mac"'
          if old_video not in s:
              raise SystemExit("Expected VIDEOS_ALLOWED target condition was not found")
          s = s.replace(old_video, 'if="windows || linux || mac"', 1)
          p.write_text(s)

          # Replace the Android-only Context dependency robustly, including CRLF files.
          import re
          main = Path(os.environ["BUILD_DIR"]) / "source" / "Main.hx"
          m = main.read_text()
          m, import_count = re.subn(
              r"(?m)^#if android\r?\nimport android\.content\.Context;\r?\n#end\r?\n?",
              "",
              m,
              count=1
          )
          if import_count != 1:
              raise SystemExit(f"Expected one Android Context import block, found {import_count}")
          old_path = "Sys.setCwd(Path.addTrailingSlash(Context.getExternalFilesDir()));"
          if old_path not in m:
              raise SystemExit("Expected Context.getExternalFilesDir() call was not found in source/Main.hx")
          m = m.replace(old_path, "Sys.setCwd(lime.system.System.applicationStorageDirectory);", 1)
          main.write_text(m)
          PY

          test -f "$BUILD_DIR/Project.xml"
          test -f "$BUILD_DIR/source/Main.hx"
          test -f "$BUILD_DIR/source/backend/Controls.hx"
          for dir in fonts shared embed songs week_assets translations base_game secrets; do
            test -d "$BUILD_DIR/assets/$dir" || { echo "Missing required asset directory: $dir"; exit 1; }
          done
          test -f "$BUILD_DIR/art/icons/iconOG.png"
          echo "Staged Psych Engine source and uploaded assets successfully."
          du -sh "$BUILD_DIR/source" "$BUILD_DIR/assets"

      - name: Install Haxe dependencies
        working-directory: .build/PsychEngine
        run: |
          set -euo pipefail
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git d3d6deafcabe60fbfde5d7efc54c11731f2737d6
          cd "$(haxelib libpath hxcpp)/tools/hxcpp"
          haxe compile.hxml
          cd "$BUILD_DIR"
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install flixel-tools 1.5.1
          haxelib install tjson 1.4.0
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis 22b1ce089dd924f15cdc4632397ef3504d464e90
          haxelib git grig.audio https://gitlab.com/haxe-grig/grig.audio.git cbf91e2180fd2e374924fe74844086aab7891666
          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3

      - name: Configure Lime for Android
        working-directory: .build/PsychEngine
        run: |
          set -euo pipefail
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          haxelib run lime setup android -- --ANDROID_SDK "$ANDROID_HOME" --ANDROID_NDK_DIR "$ANDROID_NDK_HOME" --JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"

      - name: Build Android APK
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -o pipefail
          haxelib run lime build android -D officialBuild -D mobile 2>&1 | tee android-build.log

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psych-engine-android-build
          path: |
            ${{ env.BUILD_DIR }}/export/**/*.apk
            ${{ env.BUILD_DIR }}/android-build.log
          if-no-files-found: warn
          retention-days: 14
